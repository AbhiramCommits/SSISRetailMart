services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ssisretailmart-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Str0ng!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-11433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mssql_data:
